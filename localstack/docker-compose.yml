version: '3.8'

services:
  postgres:
    image: postgres:16.11
    container_name: postgres
    environment:
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD=keycloak
      - POSTGRES_DB=keycloak_db
    volumes:
      - postgres_data:/bitnami/postgresql
    networks:
      - keycloak_network

  keycloak:
    image: quay.io/keycloak/keycloak:26.5
    container_name: keycloak
    command:
      - "start-dev"
      - "--spi--custom--provider--enabled=true"
    environment:
      - KC_DB=postgres
      - KC_DB_URL_HOST=postgres
      - KC_DB_URL_PORT=5432
      - KC_DB_URL_DATABASE=keycloak_db
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=keycloak
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KEYCLOAK_USER=admin
      - KEYCLOAK_PASSWORD=admin
      - KC_LOG_CONSOLE_LEVEL=INFO
      - KC_CACHE=local
      - DAPLA_TEAM_PROTOCOL_MAPPER_KEYCLOAK_CLIENT_AUTH_URL=${DAPLA_TEAM_PROTOCOL_MAPPER_KEYCLOAK_CLIENT_AUTH_URL}
      - DAPLA_TEAM_PROTOCOL_MAPPER_KEYCLOAK_CLIENT_ID=${DAPLA_TEAM_PROTOCOL_MAPPER_KEYCLOAK_CLIENT_ID}
      - DAPLA_TEAM_PROTOCOL_MAPPER_KEYCLOAK_CLIENT_SECRET=${DAPLA_TEAM_PROTOCOL_MAPPER_KEYCLOAK_CLIENT_SECRET}
      - TEST_USER_PRINCIPAL_NAME=${TEST_USER_PRINCIPAL_NAME}

    ports:
      - "18080:8080"
    depends_on:
      - postgres
    volumes:
      #- keycloak_data:/bitnami/keycloak
      # - ./custom-providers:/tmp/custom-providers:ro
      - ./init-scripts:/docker-entrypoint-initdb.d
      - type: bind
        read_only: true
        source: ./custom-providers
        target: /tmp/custom-providers
    networks:
      - keycloak_network
volumes:
  postgres_data:
    driver: local

networks:
  keycloak_network:
    driver: bridge
